name: factory-ci
on:
  push:
    paths: ["factory/**", "OPTIMAL LAP SCRIPTS/**", ".github/workflows/factory-ci.yml"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: factory}}
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q

  engine-regression:
    # Re-runs every weekend toolkit through the physics engine: the shipped lap must be
    # reproduced to 5 ms and the realism gate must pass. No LLM, no API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false}
      - uses: actions/setup-python@v5
        id: engine
        with: {python-version: "3.10"}
      - run: python -m pip install -r factory/requirements-engine.txt
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install python-dotenv numpy
      - name: regression
        working-directory: factory
        env:
          ENGINE_PYTHON: ${{ steps.engine.outputs.python-path }}
        run: python evals/run_evals.py --only regression
