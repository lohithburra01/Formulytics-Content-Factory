<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker></defs><rect width="1400" height="560" rx="28" fill="#000000"/><text x="700.0" y="62" font-size="30" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="2">DISCOVER</text><text x="700.0" y="92" font-size="14" fill="#C8C8C8" font-weight="500" text-anchor="middle" letter-spacing="2.5">FIND A FORMAT WORTH MAKING  ·  STEERED BY THE OWNER</text><rect x="40" y="120" width="1320" height="54" rx="14" fill="#161616" stroke="#FFE600" stroke-width="2.5" stroke-dasharray="8 6"/><text x="56" y="146" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">PRIVATE RULEBOOK  ·  READ IN CONTEXT AT EVERY STEP  ·  NEVER COMMITTED</text><rect x="40.0" y="210" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="56.0" y="236" font-size="11" fill="#FF8C00" font-weight="800" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="56.0" y="258" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">1  LANDSCAPE</text><text x="56.0" y="280" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">broadcasters, teams, creators, fans:</text><text x="56.0" y="296" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">who shows what, and the gaps</text><rect x="376.7" y="210" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="392.7" y="236" font-size="11" fill="#3CDC64" font-weight="800" text-anchor="start" letter-spacing="1.5">TOOL</text><text x="392.7" y="258" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">2  SOURCES</text><text x="392.7" y="280" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">capability card per source;</text><text x="392.7" y="296" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">'cannot support' proved by a probe</text><path d="M 354.0,266.0 L 370.7,266.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="713.4" y="210" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="729.4" y="236" font-size="11" fill="#FF8C00" font-weight="800" text-anchor="start" letter-spacing="1.5">AGENT</text><text x="729.4" y="258" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">3  ANGLES</text><text x="729.4" y="280" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">viewer question + data + visual;</text><text x="729.4" y="296" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">filtered by hard rules</text><path d="M 690.6999999999999,266.0 L 707.4,266.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="1050.1" y="210" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="1066.1" y="236" font-size="11" fill="#FFE600" font-weight="800" text-anchor="start" letter-spacing="1.5">HUMAN</text><text x="1066.1" y="258" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">CHECKPOINT 1</text><text x="1066.1" y="280" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">keep, kill or redirect;</text><text x="1066.1" y="296" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">a veto with a reason becomes a rule</text><path d="M 1027.3999999999999,266.0 L 1044.1,266.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="40.0" y="380" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="56.0" y="406" font-size="11" fill="#3CDC64" font-weight="800" text-anchor="start" letter-spacing="1.5">TOOL</text><text x="56.0" y="428" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">4  PROBES</text><text x="56.0" y="450" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">one lap, one frame, a 5 s mock;</text><text x="56.0" y="466" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">kill condition stated first</text><rect x="376.7" y="380" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="392.7" y="406" font-size="11" fill="#3CDC64" font-weight="800" text-anchor="start" letter-spacing="1.5">TOOL</text><text x="392.7" y="428" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">5  PROTOTYPE</text><text x="392.7" y="450" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">one full piece, checked against</text><text x="392.7" y="466" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">an outside reference</text><path d="M 354.0,436.0 L 370.7,436.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="713.4" y="380" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="729.4" y="406" font-size="11" fill="#FFE600" font-weight="800" text-anchor="start" letter-spacing="1.5">HUMAN</text><text x="729.4" y="428" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">CHECKPOINT 2</text><text x="729.4" y="450" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">watched like a viewer;</text><text x="729.4" y="466" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">approve, rework or kill</text><path d="M 690.6999999999999,436.0 L 707.4,436.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="1050.1" y="380" width="310" height="112" rx="14" fill="#161616" stroke="#FFFFFF" stroke-width="2.5"/><text x="1066.1" y="406" font-size="11" fill="#FF503C" font-weight="800" text-anchor="start" letter-spacing="1.5">GATE</text><text x="1066.1" y="428" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1">6  FREEZE</text><text x="1066.1" y="450" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">toolkit + grammar + gates +</text><text x="1066.1" y="466" font-size="12" fill="#969696" font-weight="500" text-anchor="start" letter-spacing="0">SKILL.md → Produce</text><path d="M 1027.3999999999999,436.0 L 1044.1,436.0" fill="none" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1205.1,326 L 1205.1,351 L 195.0,351 L 195.0,374" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1360" y="545" font-size="13" fill="#969696" font-weight="800" text-anchor="end" letter-spacing="0">@formulytics</text></svg>